<hlm-item variant="outline">
  <hlm-item-content>
    <hlm-item-title>{{ todo().title }}</hlm-item-title>
    <hlm-checkbox [checked]="todo().checked" checkedChange="onCheckedChange" inputId="checked" />
    <label hlmLabel for="checked">{{ todo().description }}</label>
    <div>{{ todo().createdAt }}</div>
  </hlm-item-content>

  <hlm-item-actions>
    <button hlmBtn variant="outline" (click)="onDelete()">Delete</button>
  </hlm-item-actions>
</hlm-item>
