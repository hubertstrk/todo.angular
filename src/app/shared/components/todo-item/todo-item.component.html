<div class="flex items-center justify-between">
  <div class="flex items-center gap-5">
    <div class="h-6" [ngClass]="getPriorityBackgroundClass()"></div>
    <div class="mt-[8px] text-gray-400" (click)="toggleChecked()">
      @if (this.todo().checked) {
        <ng-icon size="1.4rem" name="featherCheckSquare" />
      }
      @if (!this.todo().checked) {
        <ng-icon size="1.4rem" name="featherSquare" />
      }
    </div>

    <button
      type="button"
      class="cursor-pointer text-left"
      [ngClass]="this.todo().checked ? 'line-through text-gray-100/50' : ''"
      [hlmDialogTriggerFor]="dialog"
    >
      {{ this.todo().description }}
    </button>
  </div>
  <div class="flex gap-1">
    <button hlmBtn variant="outline" size="icon" (click)="deleteTodo()">
      <ng-icon name="featherX " />
    </button>
  </div>
</div>

<hlm-dialog #dialog showCloseButton closeOnOutsidePointerEvents>
  <hlm-dialog-content *hlmDialogPortal="let ctx" class="w-4xl">
    <hlm-dialog-header>
      <h3 hlmDialogTitle>{{ 'DIALOG.EDIT_TITLE' | translate }}</h3>
    </hlm-dialog-header>

    <fieldset hlmFieldSet>
      @if (this.todoBuffer) {
        <div hlmFieldGroup>
          <div hlmField>
            <label hlmFieldLabel for="field-input-description">{{
              'FORM.DESCRIPTION' | translate
            }}</label>
            <input
              hlmInput
              id="field-input-description"
              [value]="this.todoBuffer.description"
              (change)="this.todoBuffer.description = $event.target.value"
            />
          </div>
        </div>
      }
    </fieldset>

    <hlm-dialog-footer>
      <div class="flex gap-2">
        <button hlmBtn hlmDialogClose variant="outline">
          {{ 'BUTTONS.CANCEL' | translate }}
        </button>
        <button hlmBtn hlmDialogClose (click)="saveTodo()">
          {{ 'BUTTONS.SAVE' | translate }}
        </button>
      </div>
    </hlm-dialog-footer>
  </hlm-dialog-content>
</hlm-dialog>
